# Nginx 反向代理示例
# 放到 /etc/nginx/conf.d/kimuzhi.conf（或 sites-available 后做软链），
# 把 server_name 换成你的域名或服务器公网 IP，然后 nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name _;   # 换成 your-domain.com 或 1.2.3.4

    client_max_body_size 1m;
    access_log /var/log/nginx/kimuzhi.access.log;
    error_log  /var/log/nginx/kimuzhi.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # 接口都是即时查询，禁止缓存
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }
}

